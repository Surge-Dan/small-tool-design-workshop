const reloadButton=document.createElement('button');reloadButton.id='reload-latest';reloadButton.textContent='载入最新';reloadButton.hidden=true;$('#storage-banner').append(reloadButton);

function transact(label,fn,eraseHistory=false){try{const next=clone(state);fn(next);C.validate(next);if(!persist(next))return false;if(eraseHistory)history=[];else {history.push({state:clone(state),label});if(history.length>20)history.shift()}state=next;render();return true}catch(e){fail(e.message);return false}}

function renderDetail(){const n=currentNote();if(!n){selected=null;return}const cur=C.current(n),latest=n.versions.filter(v=>v.type==='addition').at(-1),rels=C.related(state,n.id),kids=C.children(state,n.id);let source=n.parentId||n.sourceText?`<p class="source">拆分来源：${esc(n.sourceText)}${n.parentId?` <button class="text-action" data-action="source" data-id="${esc(n.parentId)}">查看原念头</button>`:''}</p>`:'';

function openSheet(title,body,button,fn,mode=''){if($('#sheet').open){captureDraft();$('#sheet').close()}lastFocus=document.activeElement;formMode=mode||title+'|'+(selected||menuId||'global');formBase=state;submitAction=fn;$('#sheet-title').textContent=title;$('#sheet-body').innerHTML=body;$('#form-error').textContent='';$('#submit-sheet').hidden=!button;$('#submit-sheet').textContent=button||'保存';restoreDraft();$('#sheet').showModal()}
function captureDraft(){if(!formMode)return;if(formMode==='new'&&$('#entry-text')){draft={text:$('#entry-text').value,color:$('#color').value,intent:$('#intent').value,date:$('#review-date').value};return}const values={};$('#sheet-body').querySelectorAll('input[id],textarea[id],select[id]').forEach(el=>values[el.id]={value:el.value,checked:el.checked});const children=[...$('#sheet-body').querySelectorAll('[data-child]')].map(el=>el.value);draftCache[formMode]={values,children};lastDraftKey=formMode}

function showEntry(type){const n=currentNote();openSheet(type==='addition'?'补一句':'换个说法',`<div class="quoted">${esc(C.current(n).text)}</div><p>${type==='addition'?'补充会带时间追加，不覆盖原文。':'新表述会另存一个版本，旧表述仍可回看。'}</p><textarea id="entry-text" maxlength="1000" aria-label="新的内容" placeholder="由你写下，不自动解释"></textarea><div class="counter" id="counter">0 / 1000</div>`,'保存这次记录',()=>{if(transact(type==='addition'?'补充':'新表述',s=>C.addVersion(s,n.id,$('#entry-text').value,type)))closeSheet()})}

function showLink(){const n=currentNote(),linked=new Set(C.related(state,n.id).map(x=>x.note.id));const available=state.notes.filter(m=>m.id!==n.id&&m.lifecycle!=='trash'&&!linked.has(m.id));if(!available.length)return openSheet('关联念头','<p>目前没有其他可关联的念头。原文不会被合并。</p>',null,null);openSheet('一起再看',`<label class="field" for="link-target">选择另一条</label><select id="link-target"><option value="">请选择</option>${available.map(m=>`<option value="${esc(m.id)}">${esc(C.current(m).text.slice(0,60))}</option>`).join('')}</select><label class="field" for="link-reason">为什么放在一起</label><input id="link-reason" maxlength="100" value="我想一起看"><p>这句话由你确认，不根据内容自动推断。</p>`,'建立关联',()=>{if(transact('关联',s=>C.relate(s,n.id,$('#link-target').value,$('#link-reason').value)))closeSheet()})}

function noteMenu(id){const n=state.notes.find(n=>n.id===id);if(!n)return;menuId=id;const buttons=n.lifecycle==='trash'?[['restore','restore','恢复'],['purge','trash','永久删除']]:[['plan','calendar','换个安排'],['color','pen','更改颜色'],['relate','link','关联另一条'],['move-up','up','向前移'],['move-down','down','向后移'],['archive','archive',n.lifecycle==='archived'?'放回收藏':'归档'],['trash','trash','移到最近删除']];openSheet('这条念头',`<div class="menu-list">${buttons.map(([a,i,t])=>`<button type="button" data-action="${a}" class="${['trash','purge'].includes(a)?'danger':''}">${icon(i)}${t}</button>`).join('')}</div>`,null,null)}
function perform(action,el){const n=currentNote();if(action==='source'){closeIfOpen();go(el.dataset.id);return}if(!n)return;switch(action){case'addition':case'wording':return showEntry(action);case'split':return showSplit();case'relate':return showLink();case'history':return historySheet();case'compare':return compareSheet();case'public':return publicSheet();case'unlink':if(transact('解除关联',s=>C.unrelate(s,el.dataset.link)))toast('关联已解除，原文保留');return;case'plan':return openSheet('换个安排',planFields(n.intent,n.reviewAt),'保存安排',()=>{if(transact('安排',s=>C.setPlan(s,n.id,$('#intent').value,$('#review-date').value)))closeSheet()});case'color':return openSheet('折片颜色',colorPicker(n.color)+'<p>颜色由你选择，不代表情绪判断。</p>','换好',()=>{if(transact('换颜色',s=>C.recolor(s,n.id,$('#color').value)))closeSheet()});case'move-up':case'move-down':if(transact('移动',s=>C.move(s,n.id,action==='move-up'?-1:1))){closeSheet();go(null)}return;case'archive':if(transact(n.lifecycle==='archived'?'取消归档':'归档',s=>C.archive(s,n.id,n.lifecycle!=='archived'))){closeIfOpen();go(null)}return;case'trash':if(transact('删除',s=>C.trash(s,n.id))){closeIfOpen();go(null);toast('已移到最近删除，可撤销或恢复')}return;case'restore':if(transact('恢复',s=>C.restore(s,n.id))){closeIfOpen();go(null)}return;case'purge':return openSheet('永久删除这条念头？','<p>它的记录和关联会被移除，无法恢复。其他念头保留；本次撤销历史也会清空。</p>','永久删除',()=>{if(transact('永久删除',s=>C.purge(s,n.id),true)){closeSheet();go(null)}})}}

// Serialize the entire read-check-write critical section across same-origin tabs.
async function gateWrite(e){
 if(writeLockHeld||isDemo||tempMode)return;
 const action=e.target.closest?.('[data-action]')?.dataset.action;
 const sensitive=e.type==='submit'||e.type==='drop'||e.target.closest?.('#undo')||['unlink','move-up','move-down','archive','trash','restore'].includes(action);
 if(!sensitive)return;
 e.preventDefault();e.stopImmediatePropagation();
 if(!navigator.locks?.request){storageBlocked=true;$('#storage-message').textContent='此浏览器不支持安全的多窗口保存，可选择临时使用。';banner();fail('未保存，输入仍保留。请切换到支持 Web Locks 的浏览器，或使用临时模式。');return}
 if(writePending)return;

 try{await navigator.locks.request('thought-collection-write-v1',()=>{if(!target.isConnected||state!==base||formMode!==mode){toast('内容已变化，本次操作未执行，请重试');return}writeLockHeld=true;if(e.type==='drop')dragId=dragSource;try{target.dispatchEvent(new Event(e.type,{bubbles:true,cancelable:true}))}finally{writeLockHeld=false;if(e.type==='drop')dragId=null}})}catch{fail('无法取得保存锁，输入仍保留。')}finally{writePending=false}
}
